<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer</title>
    <link rel="stylesheet" href="colorChanger.css">
</head>
<body>

        <h1>Color Changer</h1>

    </div>

</body>
<script src="colorChanger.js"></script>
</html>
