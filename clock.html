<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="clock.css">
</head>
<body>
    <div class="container">
        <div>
            <div id="displayDate" class="date">00 / XX / 0000</div>
        </div>
        <div class="clock">
            <div id="hours" class="displayclock">00&nbsp;&nbsp<small><sub>Hrs</sub></small></div>:
            <div id="minites" class="displayclock">00&nbsp;&nbsp<small><sub>Min</sub></small></div>:
            <div id="seconds" class="displayclock">00&nbsp;<small><sub>Sec</sub></small></div>
        </div>
        
    </div>
    <script src="clock.js"></script>
</body>
</html>
